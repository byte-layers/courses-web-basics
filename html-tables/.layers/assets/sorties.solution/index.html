<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Sorties du club</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <table>
    <caption>Programme des sorties 2026</caption>
    <thead>
      <tr>
        <th scope="col">Sortie</th>
        <th scope="col">Distance</th>
        <th scope="col">Difficulté</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Pic du Midi</th>
        <td>14 km</td>
        <td>Difficile</td>
      </tr>
      <tr>
        <th scope="row">Boucle des trois lacs</th>
        <td>12 km</td>
        <td>Facile</td>
      </tr>
      <tr>
        <th scope="row">Crêtes de Bassiès</th>
        <td>18 km</td>
        <td>Difficile</td>
      </tr>
      <tr>
        <th scope="row">Cascade d'Ars</th>
        <td>9 km</td>
        <td>Moyenne</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
